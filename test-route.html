<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Rotas - Correios</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #1a1a2e; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #4285F4; margin-bottom: 20px; }
        .test-btn { 
            background: linear-gradient(135deg, #4285F4, #34A853); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px;
            margin-bottom: 20px;
        }
        .test-btn:hover { opacity: 0.9; }
        .log { 
            background: #0f0f23; 
            padding: 15px; 
            border-radius: 10px; 
            font-family: monospace; 
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 5px; padding: 5px; border-radius: 4px; }
        .log-entry.error { background: #ff000033; color: #ff6b6b; }
        .log-entry.success { background: #00ff0033; color: #69db7c; }
        .log-entry.info { background: #4285f433; }
        .map-container { height: 400px; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Teste de Rotas - Google Maps</h1>
        
        <div class="log" id="log">
            <div class="log-entry info">Aguardando teste...</div>
        </div>

        <button class="test-btn" onclick="testRouteAPI()">
            🚀 Testar Google Routes API
        </button>

        <button class="test-btn" onclick="testWithMap()" style="background: linear-gradient(135deg, #FF9500, #FF3B30);">
            🗺️ Testar com Mapa
        </button>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCWedcol0QXHlDGrW_uKh1eN9onJsgBCE0&libraries=places,geometry"></script>
    
    <script>
        const log = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        async function testRouteAPI() {
            addLog('🔄 Testando Google Routes API...', 'info');
            
            // Luanda coordinates
            const origin = { lat: -8.8390, lng: 13.2894 };
            const destination = { lat: -8.8132, lng: 13.3215 };
            
            try {
                addLog(`📍 Origem: ${origin.lat}, ${origin.lng}`, 'info');
                addLog(`📍 Destino: ${destination.lat}, ${destination.lng}`, 'info');
                
                const response = await fetch(
                    `https://routes.googleapis.com/directions/v2:computeRoutes?key=AIzaSyCWedcol0QXHlDGrW_uKh1eN9onJsgBCE0`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Goog-Field-Mask': 'routes.polyline.encodedPolyline,routes.localizedValues,routes.viewport,routes.duration,routes.distanceMeters',
                        },
                        body: JSON.stringify({
                            origin: {
                                location: {
                                    latLng: {
                                        latitude: origin.lat,
                                        longitude: origin.lng,
                                    },
                                },
                            },
                            destination: {
                                location: {
                                    latLng: {
                                        latitude: destination.lat,
                                        longitude: destination.lng,
                                    },
                                },
                            },
                            travelMode: 'DRIVE',
                            polylineEncoding: 'encodedPolyline',
                            routingPreference: 'TRAFFIC_AWARE',
                        }),
                    }
                );

                const data = await response.json();
                
                if (response.ok && data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    addLog(`✅ SUCESSO! Rota encontrada`, 'success');
                    addLog(`📏 Distância: ${route.localizedValues?.distance?.text}`, 'success');
                    addLog(`⏱️ Duração: ${route.localizedValues?.duration?.text}`, 'success');
                    addLog(`📐 Polyline: ${route.polyline?.encodedPolyline?.substring(0, 50)}...`, 'info');
                    
                    window.currentRoute = route;
                    return route;
                } else {
                    addLog(`❌ ERRO: ${JSON.stringify(data)}`, 'error');
                    return null;
                }
            } catch (error) {
                addLog(`❌ ERRO: ${error.message}`, 'error');
                return null;
            }
        }

        function decodePolyline(encoded) {
            // Polyline decoding algorithm
            const poly = [];
            let index = 0, len = encoded.length;
            let lat = 0, lng = 0;

            while (index < len) {
                let b, shift = 0, result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20);
                let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lat += dlat;

                shift = 0;
                result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20);
                let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lng += dlng;

                poly.push({ lat: lat / 1e5, lng: lng / 1e5 });
            }
            return poly;
        }

        let map, polyline;

        async function testWithMap() {
            addLog('🔄 Inicializando mapa...', 'info');
            
            if (!map) {
                map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: -8.8390, lng: 13.2894 },
                    zoom: 14
                });
            }
            
            // Test route first
            const route = await testRouteAPI();
            
            if (route && route.polyline?.encodedPolyline) {
                // Clear previous polyline
                if (polyline) polyline.setMap(null);
                
                // Decode and draw
                const points = decodePolyline(route.polyline.encodedPolyline);
                addLog(`🗺️ Desenhando ${points.length} pontos no mapa...`, 'success');
                
                polyline = new google.maps.Polyline({
                    path: points,
                    strokeColor: '#4285F4',
                    strokeOpacity: 0.9,
                    strokeWeight: 6,
                    map: map
                });
                
                // Fit bounds
                const bounds = new google.maps.LatLngBounds();
                points.forEach(p => bounds.extend(p));
                map.fitBounds(bounds);
                
                addLog('✅ Rota desenhada no mapa!', 'success');
            }
        }

        // Auto-test on load
        window.onload = () => {
            setTimeout(() => {
                addLog('⏳ Mapa carregado. Clique em "Testar com Mapa" para ver a rota.', 'info');
            }, 2000);
        };
    </script>
</body>
</html>
