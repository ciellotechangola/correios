<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Hugging Face API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #60a5fa;
            text-align: center;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }
        .success {
            background: #065f46;
            color: #34d399;
            border: 2px solid #10b981;
        }
        .error {
            background: #7f1d1d;
            color: #f87171;
            border: 2px solid #ef4444;
        }
        .info {
            background: #1e40af;
            color: #93c5fd;
            border: 2px solid #3b82f6;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        #logs {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #3b82f6;
            padding-left: 10px;
        }
        .log-success {
            border-left-color: #10b981;
            color: #34d399;
        }
        .log-error {
            border-left-color: #ef4444;
            color: #f87171;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Teste Hugging Face API</h1>
        
        <div id="status-container"></div>
        
        <button id="test-btn" onclick="runTest()">
            🚀 Testar Token do Hugging Face
        </button>

        <div id="logs"></div>
    </div>

    <script type="module">
        import { HfInference } from 'https://cdn.jsdelivr.net/npm/@huggingface/inference/+esm';

        window.HfInference = HfInference;
        
        window.runTest = async function() {
            const testBtn = document.getElementById('test-btn');
            const statusContainer = document.getElementById('status-container');
            const logs = document.getElementById('logs');
            
            testBtn.disabled = true;
            testBtn.innerHTML = '<span class="spinner"></span> Testando...';
            logs.innerHTML = '';
            
            function addLog(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                logs.appendChild(entry);
                logs.scrollTop = logs.scrollHeight;
            }
            
            try {
                addLog('Iniciando teste do Hugging Face API...', 'info');
                
                // Pegar token do .env via Vite
                const token = import.meta.env.VITE_HUGGINGFACE_API_TOKEN;
                
                if (!token) {
                    addLog('❌ Token não encontrado no .env', 'error');
                    showStatus('error', 'Token não configurado. Verifique o arquivo .env');
                    return;
                }
                
                addLog(`✅ Token encontrado: ${token.substring(0, 10)}...`, 'success');
                
                const hf = new HfInference(token);
                
                // Test 1: Autenticação
                addLog('📡 Teste 1: Verificando autenticação...', 'info');
                try {
                    const whoami = await hf.whoAmI();
                    addLog(`✅ Autenticado como: ${whoami.name || whoami.username}`, 'success');
                    addLog(`   Tipo: ${whoami.type || 'user'}`, 'success');
                } catch (error) {
                    addLog(`❌ Erro na autenticação: ${error.message}`, 'error');
                    showStatus('error', 'Token INVÁLIDO - Verifique se copiou corretamente');
                    return;
                }
                
                // Test 2: Image-to-Text
                addLog('📡 Teste 2: Testando modelo image-to-text...', 'info');
                try {
                    addLog('   Carregando imagem de teste...', 'info');
                    const response = await fetch('https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/cats.png');
                    const blob = await response.blob();
                    
                    addLog('   Enviando para modelo Salesforce/blip2-opt-2.7b...', 'info');
                    const result = await hf.imageToText({
                        data: blob,
                        model: 'Salesforce/blip2-opt-2.7b',
                    });
                    
                    addLog(`✅ Modelo respondeu!`, 'success');
                    addLog(`   Geração: ${result.generated_text?.substring(0, 100)}...`, 'success');
                    
                    showStatus('success', '🎉 HUGGING FACE ESTÁ FUNCIONANDO PERFEITAMENTE! Pronto para usar no projeto.');
                    
                } catch (error) {
                    addLog(`⚠️ Teste de imagem falhou: ${error.message}`, 'error');
                    if (error.message?.includes('rate limit') || error.message?.includes('429')) {
                        addLog('💡 Rate limit excedido. Aguarde 30 segundos e tente novamente.', 'info');
                        showStatus('info', 'Token VÁLIDO, mas rate limit excedido. Aguarde e tente novamente.');
                    } else {
                        addLog('⚠️ Erro no modelo, mas token é válido', 'info');
                        showStatus('success', 'Token VÁLIDO! Funcionará no projeto.');
                    }
                }
                
            } catch (error) {
                addLog(`❌ Erro geral: ${error.message}`, 'error');
                showStatus('error', 'Erro inesperado. Verifique o console.');
            } finally {
                testBtn.disabled = false;
                testBtn.innerHTML = '🚀 Testar Token do Hugging Face';
            }
        }
        
        function showStatus(type, message) {
            const statusContainer = document.getElementById('status-container');
            const status = document.createElement('div');
            status.className = `status ${type}`;
            status.textContent = message;
            statusContainer.appendChild(status);
        }
    </script>
</body>
</html>
